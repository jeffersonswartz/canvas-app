# Render Blueprint: https://render.com/docs/blueprint-spec
# The board is kept in memory, so run exactly one instance.
services:
  - type: web
    name: canvas-app
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
